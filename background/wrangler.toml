name = "parallel-background"
account_id = "3dcd41885bb83fea67e40a9d656153e8"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://kitrayn-cyber.github.io"
AI_WORKER_URL = "https://parallel-ai.chloerayn.workers.dev/"
AI_WORKER_ORIGIN = "https://kitrayn-cyber.github.io"
# Add public VAPID key and mailto contact here only after key generation.

[[d1_databases]]
binding = "DB"
database_name = "parallel-memory"
